version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    # Uncomment if using PostgreSQL
    # environment:
    #   - DATABASE_URL=postgresql://postgres:password@db:5432/gaply
    depends_on:
      - db
